[theme]
base = "dark"
primaryColor = "#00C8FF"
backgroundColor = "#040811"
secondaryBackgroundColor = "#0A1324"
codeBackgroundColor = "#07101F"
textColor = "#DFF6FF"
linkColor = "#38E4FF"
borderColor = "#133554"
codeTextColor = "#7CE8FF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
linkUnderline = false

font = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
headingFont = "'Orbitron':https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
codeFontSize = "0.85rem"
headingFontSizes = ["28px", "20px", "17px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

blueColor = "#00C8FF"
greenColor = "#00E6A8"
orangeColor = "#FFB020"
redColor = "#FF4D6D"
violetColor = "#8B5CF6"

[theme.sidebar]
backgroundColor = "#060C18"
secondaryBackgroundColor = "#0C182D"
codeBackgroundColor = "#07101F"
textColor = "#DFF6FF"
borderColor = "#133554"
primaryColor = "#00C8FF"
