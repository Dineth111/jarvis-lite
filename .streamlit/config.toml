[theme]
base = "dark"
primaryColor = "#00E5FF"
backgroundColor = "#02080D"
secondaryBackgroundColor = "#041018"
codeBackgroundColor = "#030B11"
textColor = "#C8F3FA"
linkColor = "#00E5FF"
borderColor = "#0E3545"
codeTextColor = "#7CEEFF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
linkUnderline = false

font = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
headingFont = "'Rajdhani':https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 13
codeFontSize = "0.80rem"
headingFontSizes = ["22px", "17px", "15px", "14px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

blueColor = "#00E5FF"
greenColor = "#00E6A8"
orangeColor = "#FFB020"
redColor = "#FF4D6D"
violetColor = "#38BDF8"

[theme.sidebar]
backgroundColor = "#030B11"
secondaryBackgroundColor = "#061621"
codeBackgroundColor = "#02080D"
textColor = "#C8F3FA"
borderColor = "#0E3545"
primaryColor = "#00E5FF"
