[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B0D11"
secondaryBackgroundColor = "#12151C"
codeBackgroundColor = "#0F1218"
textColor = "#EDEDEF"
linkColor = "#60A5FA"
borderColor = "#222733"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
linkUnderline = false

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "0.82rem"
headingFontSizes = ["22px", "18px", "15px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]

blueColor = "#3B82F6"
greenColor = "#22C55E"
orangeColor = "#F59E0B"
redColor = "#EF4444"
violetColor = "#8B5CF6"

[theme.sidebar]
backgroundColor = "#0E1016"
secondaryBackgroundColor = "#161A23"
codeBackgroundColor = "#0F1218"
textColor = "#EDEDEF"
borderColor = "#222733"
primaryColor = "#3B82F6"
