[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#090A0F"
secondaryBackgroundColor = "#11131B"
codeBackgroundColor = "#0D0F16"
textColor = "#F4F5F7"
linkColor = "#818CF8"
borderColor = "#232634"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
linkUnderline = false

font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
codeFontSize = "0.84rem"
headingFontSizes = ["26px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

blueColor = "#38BDF8"
greenColor = "#34D399"
orangeColor = "#FBBF24"
redColor = "#F87171"
violetColor = "#818CF8"

[theme.sidebar]
backgroundColor = "#0D0F15"
secondaryBackgroundColor = "#151823"
codeBackgroundColor = "#0B0D13"
textColor = "#F4F5F7"
borderColor = "#1F2330"
primaryColor = "#6366F1"
